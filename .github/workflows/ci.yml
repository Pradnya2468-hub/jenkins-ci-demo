name: Python CI Pipeline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get source code
      - name: Checkout Code
        uses: actions/checkout@v4
      # Step 2: Configure Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
      # Step 4: Run Python application
      - name: Run Application
        run: python app.py
      # Step 5: Execute unit tests
      - name: Run Unit Tests
        run: pytest -v
      # Step 6: Check code quality
      - name: Code Quality Check
        run: flake8 app.py test_app.py --max-line-length=100

      # Step 7: Pipeline completion
      - name: CI Success
        run: echo "Python CI Pipeline Completed Successfully!"
